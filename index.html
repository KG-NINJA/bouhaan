<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>周囲確認 & フェイクコール</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0b132b" />
</head>
<body>
  <header class="app-header">
    <h1>周囲確認 & フェイクコール</h1>
  </header>

  <main class="container">
    <section class="video-grid" id="videoGrid">
      <div class="video-card" id="backCard">
        <div class="label">後方カメラ</div>
        <video id="backVideo" autoplay muted playsinline></video>
      </div>
      <div class="video-card" id="frontCard">
        <div class="label">前方カメラ</div>
        <video id="frontVideo" autoplay muted playsinline></video>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn" class="btn primary">カメラ開始</button>
      <button id="switchBtn" class="btn" disabled>カメラ切替</button>
      <button id="fakeCallBtn" class="btn danger">フェイクコール</button>
      <button id="stopBtn" class="btn" disabled>停止</button>
    </section>

    <p id="status" class="status"></p>

    <section class="info-grid">
      <div class="info-card">
        <div class="info-title">防犯チェックポイント</div>
        <ul class="info-list">
          <li>明るい場所・人通りの多い道を優先する。</li>
          <li>スマホを持つ手は肩幅・周辺を映すよう少し離す。</li>
          <li>背面カメラの映像を確認しつつ、足音や気配にも注意。</li>
          <li>違和感を覚えたら店や施設に入り、周囲に助けを求める。</li>
        </ul>
      </div>
      <div class="info-card">
        <div class="info-title">フェイク通話 例セリフ</div>
        <ul class="info-list">
          <li>「もうすぐ駅に着くよ。改札前で待っててね」</li>
          <li>「今いる場所を共有しておくね」</li>
          <li>「もし何かあればすぐ電話するから」</li>
          <li>声を出せない時は画面を耳にあて、話している雰囲気を演出。</li>
        </ul>
      </div>
    </section>
  </main>

  <!-- フェイクコールのオーバーレイ -->
  <div id="callOverlay" class="call-overlay hidden" aria-hidden="true">
    <div class="call-card">
      <div class="call-header">着信中...</div>
      <div class="caller-info">
        <div class="avatar">📞</div>
        <div class="caller-text">
          <div class="name">非通知設定</div>
          <div class="sub">モバイル</div>
        </div>
      </div>
      <div class="call-actions">
        <button id="answerBtn" class="circle-btn accept" aria-label="応答">✅</button>
        <button id="declineBtn" class="circle-btn decline" aria-label="拒否">❌</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
